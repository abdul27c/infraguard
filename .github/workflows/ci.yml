name: InfraGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfraGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify insecure plan is blocked
        shell: bash
        run: |
          set +e
          python -m infraguard.cli tests/fixtures/insecure-plan.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected insecure plan to exit 1, got $status"
            exit 1
          fi

      - name: Verify safe plan passes
        run: python -m infraguard.cli tests/fixtures/safe-plan.json
YAML

cat > README.md <<'EOF'
# InfraGuard — Infrastructure Security Gate

InfraGuard is a Python-based security scanner that evaluates Terraform plan
JSON against an initial set of AWS infrastructure security rules.

## Current checks

- **IG-SG-001:** Flags public ingress to SSH, RDP, or all protocols.
- **IG-S3-001:** Flags selected public S3 bucket ACLs.
- **IG-IAM-001:** Flags IAM policies allowing all actions on all resources.

## Requirements

- Python 3.10+
- Terraform, to generate a real plan JSON file

## Setup

```bash
python3 -m venv .venv
source .venv/bin/activate
python -m pip install -e .