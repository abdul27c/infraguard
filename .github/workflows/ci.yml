name: InfraGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-security-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfraGuard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify insecure plan is blocked
        shell: bash
        run: |
          set +e
          python -m infraguard.cli tests/fixtures/insecure-plan.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected insecure plan to exit 1, got $status"
            exit 1
          fi

      - name: Verify safe plan passes
        run: python -m infraguard.cli tests/fixtures/safe-plan.json
